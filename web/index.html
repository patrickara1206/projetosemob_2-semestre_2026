<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">


  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="semob_dashboard">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">


  <link rel="icon" type="image/png" href="favicon.png" />

  <title>semob_dashboard</title>
  <link rel="manifest" href="manifest.json">
  <style>
    #semob-loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #F4F6F8;
      transition: opacity 250ms ease;
    }

    #semob-loading-logo {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(356px, calc(100vw - 112px));
      height: 130px;
      transform: translate(-50%, -50%);
    }

    #semob-loading-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      animation: semob-pulse 1.2s ease-in-out infinite;
    }

    @keyframes semob-pulse {

      0%,
      100% {
        transform: scale(.94);
        opacity: .7;
      }

      50% {
        transform: scale(1.06);
        opacity: 1;
      }
    }

    body:not(.semob-ready) flutter-view {
      opacity: 0;
    }

    flutter-view {
      transition: opacity 250ms ease;
    }

    @media (prefers-reduced-motion: reduce) {
      #semob-loading-logo img {
        animation: none;
      }

      #semob-loading,
      flutter-view {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <div id="semob-loading" role="status" aria-label="Carregando SEMOB">
    <div id="semob-loading-logo"><img src="assets/assets/images/brasao_sao_caetano.png"
        alt="Brasão de São Caetano do Sul"></div>
  </div>
  <script>
    window.semobAppReady = function () {
      const overlay = document.getElementById('semob-loading');

      if (!overlay || overlay.dataset.ready) return;

      overlay.dataset.ready = 'true';

      document.body.classList.add('semob-ready');

      overlay.style.opacity = '0';
      overlay.style.pointerEvents = 'none';

      setTimeout(function () {
        overlay.remove();
      }, 250);
    };
    window.semobDownloadCsv = function (nome, conteudo) {
      const url = URL.createObjectURL(new Blob([conteudo], { type: 'text/csv;charset=utf-8' }));
      const link = document.createElement('a');
      link.href = url;
      link.download = nome;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    };
    window.semobLoginReady = function (left, top, width, height) {
      const overlay = document.getElementById('semob-loading');
      const logo = document.getElementById('semob-loading-logo');
      if (!overlay || overlay.dataset.ready) return;
      overlay.dataset.ready = 'true';
      const start = logo.getBoundingClientRect();
      logo.querySelector('img').style.animation = 'none';
      Object.assign(logo.style, { left: start.left + 'px', top: start.top + 'px', width: start.width + 'px', height: start.height + 'px', transform: 'none' });
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const movement = logo.animate([
        { left: start.left + 'px', top: start.top + 'px', width: start.width + 'px', height: start.height + 'px' },
        { left: left + 'px', top: top + 'px', width: width + 'px', height: height + 'px' }
      ], { duration: reduced ? 0 : 650, easing: 'cubic-bezier(.22,1,.36,1)', fill: 'forwards' });
      movement.finished.then(function () {
        document.body.classList.add('semob-ready');
        overlay.style.opacity = '0';
        overlay.style.pointerEvents = 'none';
        setTimeout(function () { overlay.remove(); }, reduced ? 0 : 250);
      });
    };
  </script>
  <script src="flutter_bootstrap.js?semob=20261012" async></script>
  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper><div class="vw-plugin-top-wrapper"></div></div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    window.addEventListener('load', function () {
      if (window.VLibras) new window.VLibras.Widget('https://vlibras.gov.br/app');
    });
  </script>
</body>

</html>
